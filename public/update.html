<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>G4 — Refresh app files</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b14;
        color: #e8edf7;
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.04);
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        color: #f0b429;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.45;
        color: #9aa6bd;
        font-size: 0.95rem;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.85rem 1rem;
        font-weight: 700;
        background: #f0b429;
        color: #0b1220;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .ok {
        color: #86efac;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Refresh app files</h1>
      <p>
        Clears the installed app cache so your phone loads the latest Mission Control.
        Your habits, goals, and password data on this device are kept.
      </p>
      <button id="go" type="button">Clear cache &amp; open login</button>
      <p id="status" class="ok" hidden></p>
    </div>
    <script>
      const btn = document.getElementById('go');
      const status = document.getElementById('status');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        status.hidden = false;
        status.textContent = 'Clearing cache…';
        try {
          const regs = await navigator.serviceWorker?.getRegistrations?.();
          await Promise.all((regs || []).map((r) => r.unregister()));
          const keys = await caches?.keys?.();
          await Promise.all((keys || []).map((k) => caches.delete(k)));
        } catch (e) {
          console.warn(e);
        }
        status.textContent = 'Opening login…';
        location.replace('./#/login?v=' + Date.now());
      });
    </script>
  </body>
</html>
